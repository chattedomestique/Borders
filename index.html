<!doctype html>
<html lang="en" data-palette="sand">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <title>Border Studio</title>
    <meta name="description" content="Add beautiful borders and frames to your photos and videos — save directly to your iOS Photos library." />

    <!-- PWA — the manifest link + theme-color are injected by vite-plugin-pwa. -->
    <!-- Both equal the style guide's --canvas in the sand palette, resolved in a
         browser (light / dark). Change them together with data-palette. -->
    <meta name="theme-color" content="#E9E8DF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F0B" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- §3.4: `default`, not `black-translucent` — the translucent style forces
         light status-bar text that is invisible over the pale light theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Border Studio" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23C9622C'/><rect x='8' y='8' width='84' height='84' rx='14' fill='none' stroke='white' stroke-width='10'/><rect x='28' y='28' width='44' height='44' rx='8' fill='white'/></svg>" />
    <!-- §3.3: a real 180×180 PNG — iOS substitutes a blurry screenshot for SVG. -->
    <link rel="apple-touch-icon" href="/Borders/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Border Studio" />
    <meta property="og:description" content="Add beautiful borders and frames to your photos." />
    <meta property="og:type" content="website" />
    <script type="module" crossorigin src="/Borders/assets/index-BmAd02sX.js"></script>
    <link rel="stylesheet" crossorigin href="/Borders/assets/index-sBMoQfYh.css">
  <link rel="manifest" href="/Borders/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
    <!-- The style guide's layout scripts (see src/vendor/styleguide/VERSION.md):
         core (SG.fit), the segmented control's fit, the toolbar's pages. Plain
         scripts by design (they work from file://), so not part of the bundle. -->
    <script src="/Borders/sg/core.min.js" defer></script>
    <script src="/Borders/sg/js/42-chip.min.js" defer></script>
    <script src="/Borders/sg/js/44-segmented.min.js" defer></script>
    <!-- 70-scrubber defines SG.afterParse, which 71-toolbar needs (not listed in
         the style guide's manifest). Inert without .scrubber elements. -->
    <script src="/Borders/sg/js/70-scrubber.min.js" defer></script>
    <script src="/Borders/sg/js/71-toolbar.min.js" defer></script>
  </body>
</html>
